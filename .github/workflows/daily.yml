name: 每日法規/HR情報推播

on:
  schedule:
    # 01:05 UTC = 09:05 台灣時間;刻意避開整點,GitHub 官方文件說整點是排程高負載時段,容易延遲或被跳過
    - cron: "5 1 * * *"
  workflow_dispatch: {}

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安裝相依套件
        working-directory: scraper
        run: npm install

      - name: 執行爬取 + Gemini 判斷 + LINE 推播 + 寫入 Notion
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DEDUPE_DATABASE_ID: ${{ secrets.NOTION_DEDUPE_DATABASE_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_HR_USER_ID: ${{ secrets.LINE_HR_USER_ID }}
        run: npm start

      - name: 保留執行紀錄與推播內容
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            scraper/line-message.json
          retention-days: 14
