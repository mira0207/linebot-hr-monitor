name: 每日法規/HR情報推播

on:
  # 排程改用外部服務(cron-job.org,每日 09:10 台灣時間)呼叫 workflow_dispatch 觸發,
  # 不用 GitHub 原生的 schedule 事件——實測 GitHub 自己的排程延遲超過 3 小時甚至可能跳過整天,
  # 不可靠。這裡故意不寫 schedule,避免跟外部觸發同一天執行兩次。
  workflow_dispatch: {}

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      # v4 內部跑 Node 20,GitHub 已棄用並強制切到 Node 24 且每次執行都出警告,升到目前最新大版
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安裝相依套件
        working-directory: scraper
        run: npm install

      - name: 執行爬取 + Gemini 判斷 + LINE 推播 + 寫入 Notion
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DEDUPE_DATABASE_ID: ${{ secrets.NOTION_DEDUPE_DATABASE_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_HR_USER_ID: ${{ secrets.LINE_HR_USER_ID }}
          LINE_STAFF_GROUP_ID: ${{ secrets.LINE_STAFF_GROUP_ID }}
        run: npm start

      - name: 保留執行紀錄與推播內容
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-output
          path: |
            scraper/line-message.json
          retention-days: 14
